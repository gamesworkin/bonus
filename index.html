<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Patches e Mods</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos básicos para o funcionamento do Modal e Grid (Substitua ou adapte ao seu CSS antigo) */
        body { 
            font-family: 'Arial', sans-serif; 
            background-color: #121212; 
            color: #fff; 
            margin: 0; 
            padding: 20px; 
            user-select: none; 
        }
        .games-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
        }
        .game-card { 
            background: #1e1e1e; 
            border-radius: 8px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .game-card:hover { 
            transform: scale(1.05); 
        }
        .game-cover { 
            width: 100%; 
            height: 250px; 
            object-fit: cover; 
        }
        .game-info { 
            padding: 15px; 
        }
        .badge { 
            background: #00bcd4; 
            color: #000; 
            padding: 3px 8px; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold; 
        }
        .badge.purple { 
            background: #9c27b0; 
            color: #fff; 
        }
        .modal-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.8); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.3s; 
        }
        .modal-overlay.open { 
            opacity: 1; 
            pointer-events: auto; 
        }
        .modal-content { 
            background: #1a1a1a; 
            padding: 30px; 
            border-radius: 12px; 
            max-width: 600px; 
            width: 90%; 
            position: relative; 
        }
        .close-button { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: none; 
            border: none; 
            color: #fff; 
            font-size: 24px; 
            cursor: pointer; 
        }
        .modal-body { 
            display: flex; 
            gap: 20px; 
        }
        .modal-cover { 
            width: 180px; 
            height: 240px; 
            object-fit: cover; 
            border-radius: 6px; 
        }
        .modal-right { 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .modal-title { 
            margin: 0 0 10px 0; 
            font-size: 24px; 
        }
        .modal-badges { 
            margin-bottom: 15px; 
            display: flex; 
            gap: 8px; 
        }
        .modal-description { 
            color: #aaa; 
            margin-bottom: 20px; 
            line-height: 1.5; 
        }
        .btn-download { 
            display: inline-block; 
            background: #6200ea; 
            color: #fff; 
            padding: 12px 24px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            text-align: center; 
            transition: background 0.2s; 
        }
        .btn-download:hover { 
            background: #3700b3; 
        }
    </style>
</head>
<body>

    <div id="gamesGrid" class="games-grid"></div>

    <div id="gameModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-button" aria-label="Fechar Modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
            
            <div class="modal-body">
                <div class="modal-left">
                    <img id="modalCover" src="" alt="Capa do Jogo" class="modal-cover">
                </div>
                <div class="modal-right">
                    <h2 id="modalTitle" class="modal-title"></h2>
                    <div id="modalBadgeContainer" class="modal-badges"></div>
                    <p id="modalDescription" class="modal-description"></p>
                    
                    <a id="modalDownloadBtn" href="#" download class="btn-download">
                        <i class="fa-solid fa-cloud-arrow-down"></i> BAIXAR AGORA
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
